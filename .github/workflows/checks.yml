name: AQUA checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Install check tools
        run: python -m pip install -r tools/checks/requirements-dev.txt
      - name: Source, formatting and correctness checks
        run: |
          python tools/checks/check_source.py
          python tools/checks/check_lock.py
          python -m black --check backend eval tools/checks ops
          python -m ruff check backend eval tools/checks ops
          python tools/checks/p05_browser_cleanup_test.py
          python tools/checks/p05_browser_startup_test.py
          python tools/checks/p06_browser_routes_test.py
          python tools/checks/p06_browser_analysis_test.py
          python tools/checks/test_p08_browser_fixture.py
          python tools/checks/test_p10b_browser_fixture.py
          python tools/checks/test_p10c_browser_fixture.py
          python tools/checks/test_p10c_proxy_fixture.py
      - name: Audit pinned runtime dependencies
        run: python -m pip_audit --no-deps --disable-pip -r tools/checks/requirements-runtime.lock
      - name: Prepare isolated test images
        run: |
          docker build --pull -t aqua-checks:p00 -f tools/checks/Dockerfile .
          docker build --pull -t aqua-runtime:check -f backend/Dockerfile .
          docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
          docker pull node:24.19.0-bookworm-slim@sha256:a9f5f7c91a432850b2a8a7797adf5eadb6c733ceed61167806cee7ea7fbc29df
          docker pull nginx@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
      - name: Telemetry oversized-header denial and normal-header recovery
        run: >-
          docker run --rm -i --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 128m --cpus 1 --pids-limit 32
          --user 1000:1000 --tmpfs /tmp:rw,nosuid,nodev,size=8m
          aqua-runtime:check python - --expect guarded < tools/checks/telemetry_probe.py
      - name: Backend contracts and both disposable database fixtures
        run: python tools/checks/run_backend.py --image aqua-runtime:check
      - name: Private workspace access-log protection
        run: >-
          docker run --rm -i --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 256m --memory-swap 256m
          --cpus 1 --pids-limit 64 --user 1000:1000
          --tmpfs /tmp:rw,nosuid,nodev,noexec,size=8m
          aqua-runtime:check python - < tools/checks/workspace_runtime_probe.py
      - name: Private database installer with disposable socket volumes
        run: python tools/checks/storage_deployment.py --image aqua-runtime:check
      - name: Rate-limit bypass, denial and recovery checks in an isolated proxy
        run: python tools/checks/run_proxy.py
      - name: Identity action aliases, denial and recovery in a separate isolated proxy
        run: python tools/checks/run_proxy.py --identity-actions
      # The offline SSR tests import React from this locked dependency tree.
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-fund
      - name: Frontend tests without network access
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 1g --cpus 2 --pids-limit 128
          --user 1000:1000 --tmpfs /tmp:rw,nosuid,nodev,size=64m
          -v "$PWD/frontend:/work:ro" -w /work
          node:24.19.0-bookworm-slim@sha256:a9f5f7c91a432850b2a8a7797adf5eadb6c733ceed61167806cee7ea7fbc29df
          node --test "checks/*.test.mjs"
      - name: Frontend dependency audit and production build
        working-directory: frontend
        env:
          VITE_AQUA_DEMO_MODE: 'false'
          VITE_AQUA_USE_MOCK: 'false'
          VITE_AQUA_UI_SHELL: 'opal'
        run: |
          npm audit --audit-level=low
          npm run build -- --manifest
          mkdir -p "${{ runner.temp }}/aqua-p05/opal"
          node checks/plotly-bundle.mjs dist > "${{ runner.temp }}/aqua-p05/opal/bundle.json"
      - name: Synthetic browser security and responsive UI journeys
        working-directory: frontend
        env:
          AQUA_P05_EXPECTED_SHELL: opal
          AQUA_P05_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p05/opal/synthetic
        run: |
          export AQUA_CHROME_EXECUTABLE="$(command -v google-chrome)"
          test -x "$AQUA_CHROME_EXECUTABLE"
          node checks/p05-browser.mjs
      - name: Real private-database browser journeys and rate-limit recovery
        env:
          AQUA_P05_EXPECTED_SHELL: opal
          AQUA_P06_ANALYSIS_FIXTURE: 'true'
          AQUA_P05_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p05/opal/real
        run: |
          python tools/checks/p05_browser_startup_smoke.py
          export AQUA_CHROME_EXECUTABLE="$(command -v google-chrome)"
          test -x "$AQUA_CHROME_EXECUTABLE"
          export AQUA_P05_BRIDGE_EXECUTABLE="$(command -v python)"
          export AQUA_P05_BRIDGE_ARGS_JSON='["tools/checks/p05_browser_backend.py","--image","aqua-runtime:check","--workspace-analysis"]'
          node frontend/checks/p05-real-backend-browser.mjs
      - name: Opal Plotly controls and isolated database visual lifecycle
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P05_EXPECTED_SHELL: opal
          AQUA_P08_DIST: ${{ github.workspace }}/frontend/dist
          AQUA_P08_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p08/opal
          AQUA_P09_VISUAL_PREFERENCES: table
        run: |
          export AQUA_CHROME_EXECUTABLE="$(command -v google-chrome)"
          test -x "$AQUA_CHROME_EXECUTABLE"
          export AQUA_P08_BRIDGE_EXECUTABLE="$(command -v python)"
          export AQUA_P08_BACKEND_IMAGE="$(docker image inspect aqua-runtime:check --format '{{.Id}}')"
          export AQUA_P08_BRIDGE_ARGS_JSON="$(python -c 'import json,os; print(json.dumps(["-u","../tools/checks/p08_browser_backend.py","--image",os.environ["AQUA_P08_BACKEND_IMAGE"]]))')"
          node checks/p08-browser.mjs
      - name: Opal Settings preferences and isolated database save/import journeys
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P05_EXPECTED_SHELL: opal
          AQUA_P09_DIST: ${{ github.workspace }}/frontend/dist
          AQUA_P09_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p09/opal
        run: |
          export AQUA_CHROME_EXECUTABLE="$(command -v google-chrome)"
          test -x "$AQUA_CHROME_EXECUTABLE"
          export AQUA_P09_BRIDGE_EXECUTABLE="$(command -v python)"
          export AQUA_P09_BACKEND_IMAGE="$(docker image inspect aqua-runtime:check --format '{{.Id}}')"
          export AQUA_P09_BRIDGE_ARGS_JSON="$(python -c 'import json,os; print(json.dumps(["-u","../tools/checks/p08_browser_backend.py","--image",os.environ["AQUA_P09_BACKEND_IMAGE"]]))')"
          node checks/p09-browser.mjs
      - name: Opal account profile and isolated session review journeys
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P05_EXPECTED_SHELL: opal
          AQUA_P10A_DIST: ${{ github.workspace }}/frontend/dist
          AQUA_P10A_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10a/opal
        run: |
          export AQUA_CHROME_EXECUTABLE="$(command -v google-chrome)"
          test -x "$AQUA_CHROME_EXECUTABLE"
          export AQUA_P10A_BRIDGE_EXECUTABLE="$(command -v python)"
          export AQUA_P10A_BACKEND_IMAGE="$(docker image inspect aqua-runtime:check --format '{{.Id}}')"
          export AQUA_P10A_BRIDGE_ARGS_JSON="$(python -c 'import json,os; print(json.dumps(["-u","../tools/checks/p08_browser_backend.py","--image",os.environ["AQUA_P10A_BACKEND_IMAGE"]]))')"
          node checks/p10a-account-browser.mjs
      - name: Build classic UI rollback with the current secure auth contracts
        working-directory: frontend
        env:
          VITE_AQUA_DEMO_MODE: 'false'
          VITE_AQUA_USE_MOCK: 'false'
          VITE_AQUA_UI_SHELL: legacy
        run: |
          npm run build -- --manifest
          mkdir -p "${{ runner.temp }}/aqua-p05/legacy"
          node checks/plotly-bundle.mjs dist > "${{ runner.temp }}/aqua-p05/legacy/bundle.json"
      - name: Classic UI security, responsive and real database rate-limit journeys
        env:
          AQUA_P05_EXPECTED_SHELL: legacy
          AQUA_P06_ANALYSIS_FIXTURE: 'true'
        run: |
          export AQUA_CHROME_EXECUTABLE="$(command -v google-chrome)"
          test -x "$AQUA_CHROME_EXECUTABLE"
          export AQUA_P05_ARTIFACT_DIR="${{ runner.temp }}/aqua-p05/legacy/synthetic"
          node frontend/checks/p05-browser.mjs
          export AQUA_P05_ARTIFACT_DIR="${{ runner.temp }}/aqua-p05/legacy/real"
          export AQUA_P05_BRIDGE_EXECUTABLE="$(command -v python)"
          export AQUA_P05_BRIDGE_ARGS_JSON='["tools/checks/p05_browser_backend.py","--image","aqua-runtime:check","--workspace-analysis"]'
          node frontend/checks/p05-real-backend-browser.mjs
      - name: Classic Plotly controls and isolated database visual lifecycle
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P05_EXPECTED_SHELL: legacy
          AQUA_P08_DIST: ${{ github.workspace }}/frontend/dist
          AQUA_P08_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p08/legacy
          AQUA_P09_VISUAL_PREFERENCES: table
        run: |
          export AQUA_CHROME_EXECUTABLE="$(command -v google-chrome)"
          test -x "$AQUA_CHROME_EXECUTABLE"
          export AQUA_P08_BRIDGE_EXECUTABLE="$(command -v python)"
          export AQUA_P08_BACKEND_IMAGE="$(docker image inspect aqua-runtime:check --format '{{.Id}}')"
          export AQUA_P08_BRIDGE_ARGS_JSON="$(python -c 'import json,os; print(json.dumps(["-u","../tools/checks/p08_browser_backend.py","--image",os.environ["AQUA_P08_BACKEND_IMAGE"]]))')"
          node checks/p08-browser.mjs
      - name: Classic Settings preferences and isolated database save/import journeys
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P05_EXPECTED_SHELL: legacy
          AQUA_P09_DIST: ${{ github.workspace }}/frontend/dist
          AQUA_P09_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p09/legacy
        run: |
          export AQUA_CHROME_EXECUTABLE="$(command -v google-chrome)"
          test -x "$AQUA_CHROME_EXECUTABLE"
          export AQUA_P09_BRIDGE_EXECUTABLE="$(command -v python)"
          export AQUA_P09_BACKEND_IMAGE="$(docker image inspect aqua-runtime:check --format '{{.Id}}')"
          export AQUA_P09_BRIDGE_ARGS_JSON="$(python -c 'import json,os; print(json.dumps(["-u","../tools/checks/p08_browser_backend.py","--image",os.environ["AQUA_P09_BACKEND_IMAGE"]]))')"
          node checks/p09-browser.mjs
      - name: Classic account profile and isolated session review journeys
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P05_EXPECTED_SHELL: legacy
          AQUA_P10A_DIST: ${{ github.workspace }}/frontend/dist
          AQUA_P10A_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10a/legacy
        run: |
          export AQUA_CHROME_EXECUTABLE="$(command -v google-chrome)"
          test -x "$AQUA_CHROME_EXECUTABLE"
          export AQUA_P10A_BRIDGE_EXECUTABLE="$(command -v python)"
          export AQUA_P10A_BACKEND_IMAGE="$(docker image inspect aqua-runtime:check --format '{{.Id}}')"
          export AQUA_P10A_BRIDGE_ARGS_JSON="$(python -c 'import json,os; print(json.dumps(["-u","../tools/checks/p08_browser_backend.py","--image",os.environ["AQUA_P10A_BACKEND_IMAGE"]]))')"
          node checks/p10a-account-browser.mjs
      # Only synthetic browser evidence is retained. Never upload the checkout,
      # arbitrary temporary files, fixture pipes, credentials or runtime config.
      - name: Retain bounded browser reports after success or failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p05-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aqua-p05/opal/bundle.json
            ${{ runner.temp }}/aqua-p05/legacy/bundle.json
            ${{ runner.temp }}/aqua-p05/opal/synthetic/*.json
            ${{ runner.temp }}/aqua-p05/opal/synthetic/*.png
            ${{ runner.temp }}/aqua-p05/opal/real/*.json
            ${{ runner.temp }}/aqua-p05/opal/real/*.png
            ${{ runner.temp }}/aqua-p05/legacy/synthetic/*.json
            ${{ runner.temp }}/aqua-p05/legacy/synthetic/*.png
            ${{ runner.temp }}/aqua-p05/legacy/real/*.json
            ${{ runner.temp }}/aqua-p05/legacy/real/*.png
            ${{ runner.temp }}/aqua-p08/opal/*.json
            ${{ runner.temp }}/aqua-p08/opal/*.png
            ${{ runner.temp }}/aqua-p08/legacy/*.json
            ${{ runner.temp }}/aqua-p08/legacy/*.png
            ${{ runner.temp }}/aqua-p09/opal/*.json
            ${{ runner.temp }}/aqua-p09/opal/*.png
            ${{ runner.temp }}/aqua-p09/legacy/*.json
            ${{ runner.temp }}/aqua-p09/legacy/*.png
            ${{ runner.temp }}/aqua-p10a/opal/*.json
            ${{ runner.temp }}/aqua-p10a/opal/*.png
            ${{ runner.temp }}/aqua-p10a/legacy/*.json
            ${{ runner.temp }}/aqua-p10a/legacy/*.png
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

  account-security:
    name: Account security (${{ matrix.shell }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [opal, legacy]
    defaults:
      run:
        shell: bash
    env:
      AQUA_P05_EXPECTED_SHELL: ${{ matrix.shell }}
      AQUA_P10B_DIST: ${{ github.workspace }}/frontend/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Install pinned check tools
        run: python -m pip install -r tools/checks/requirements-dev.txt
      - name: Validate dedicated security fixture boundaries offline
        run: python tools/checks/test_p10b_browser_fixture.py
      - name: Prepare isolated security fixture images
        id: runtime
        run: |
          docker build --pull -t aqua-checks:p00 -f tools/checks/Dockerfile .
          docker build --pull -t aqua-runtime:check -f backend/Dockerfile .
          docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
          docker pull node:24.19.0-bookworm-slim@sha256:a9f5f7c91a432850b2a8a7797adf5eadb6c733ceed61167806cee7ea7fbc29df
          docker pull nginx@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-fund
      - name: Build the selected secure UI shell
        id: build
        working-directory: frontend
        env:
          VITE_AQUA_DEMO_MODE: 'false'
          VITE_AQUA_USE_MOCK: 'false'
          VITE_AQUA_UI_SHELL: ${{ matrix.shell }}
        run: npm run build -- --manifest
      - name: Bind Chrome and the exact security backend image
        id: fixture
        run: |
          chrome="$(command -v google-chrome)"
          test -x "$chrome"
          python="$(command -v python)"
          test -x "$python"
          image="$(docker image inspect aqua-runtime:check --format '{{.Id}}')"
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          export AQUA_P10B_BACKEND_IMAGE="$image"
          args="$(python -c 'import json,os; print(json.dumps(["-u","../tools/checks/p10b_browser_backend.py","--image",os.environ["AQUA_P10B_BACKEND_IMAGE"]]))')"
          {
            echo "AQUA_CHROME_EXECUTABLE=$chrome"
            echo "AQUA_P10B_BRIDGE_EXECUTABLE=$python"
            echo "AQUA_P10B_BACKEND_IMAGE=$image"
            echo "AQUA_P10B_BRIDGE_ARGS_JSON=$args"
          } >> "$GITHUB_ENV"
      # Each process creates and absence-confirms cleanup of its own fresh
      # fixture. Existing 150-second/request/resource limits remain unchanged.
      - name: Password change with a fresh isolated account
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10B_SCENARIO: password
          AQUA_P10B_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/password
        run: node checks/p10b-security-browser.mjs
      - name: Revoke current session with a fresh isolated account
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10B_SCENARIO: revoke-current
          AQUA_P10B_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/revoke-current
        run: node checks/p10b-security-browser.mjs
      - name: Revoke other session with a fresh isolated account
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10B_SCENARIO: revoke-other
          AQUA_P10B_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/revoke-other
        run: node checks/p10b-security-browser.mjs
      - name: Revoke all sessions with a fresh isolated account
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10B_SCENARIO: revoke-all
          AQUA_P10B_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/revoke-all
        run: node checks/p10b-security-browser.mjs
      - name: Reconcile a lost commit response with a fresh isolated account
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10B_SCENARIO: lost-other
          AQUA_P10B_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/lost-other
        run: node checks/p10b-security-browser.mjs
      - name: Recover failed verification with a fresh isolated account
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10B_SCENARIO: verification-failure
          AQUA_P10B_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/verification-failure
        run: node checks/p10b-security-browser.mjs
      - name: Retain bounded synthetic security evidence after success or failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p10b-security-${{ matrix.shell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/password/*.json
            ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/password/*.png
            ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/revoke-current/*.json
            ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/revoke-current/*.png
            ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/revoke-other/*.json
            ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/revoke-other/*.png
            ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/revoke-all/*.json
            ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/revoke-all/*.png
            ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/lost-other/*.json
            ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/lost-other/*.png
            ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/verification-failure/*.json
            ${{ runner.temp }}/aqua-p10b/${{ matrix.shell }}/verification-failure/*.png
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

  identity-actions:
    name: Identity actions (${{ matrix.shell }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [opal, legacy]
    defaults:
      run:
        shell: bash
    env:
      AQUA_P05_EXPECTED_SHELL: ${{ matrix.shell }}
      AQUA_P10C_DIST: ${{ github.workspace }}/frontend/dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Install pinned check tools
        run: python -m pip install -r tools/checks/requirements-dev.txt
      - name: Validate dedicated identity fixture boundaries offline
        run: python tools/checks/test_p10c_browser_fixture.py
      - name: Prepare isolated identity fixture images
        id: runtime
        run: |
          docker build --pull -t aqua-checks:p00 -f tools/checks/Dockerfile .
          docker build --pull -t aqua-runtime:check -f backend/Dockerfile .
          docker pull postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
          docker pull node:24.19.0-bookworm-slim@sha256:a9f5f7c91a432850b2a8a7797adf5eadb6c733ceed61167806cee7ea7fbc29df
          docker pull nginx@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-fund
      - name: Build the selected secure UI shell
        id: build
        working-directory: frontend
        env:
          VITE_AQUA_DEMO_MODE: 'false'
          VITE_AQUA_USE_MOCK: 'false'
          VITE_AQUA_UI_SHELL: ${{ matrix.shell }}
        run: npm run build -- --manifest
      - name: Bind Chrome and the exact identity backend image
        id: fixture
        run: |
          chrome="$(command -v google-chrome)"
          test -x "$chrome"
          python="$(command -v python)"
          test -x "$python"
          image="$(docker image inspect aqua-runtime:check --format '{{.Id}}')"
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          export AQUA_P10C_BACKEND_IMAGE="$image"
          args="$(python -c 'import json,os; print(json.dumps(["-u","../tools/checks/p10c_browser_backend.py","--image",os.environ["AQUA_P10C_BACKEND_IMAGE"]]))')"
          {
            echo "AQUA_CHROME_EXECUTABLE=$chrome"
            echo "AQUA_P10C_BRIDGE_EXECUTABLE=$python"
            echo "AQUA_P10C_BACKEND_IMAGE=$image"
            echo "AQUA_P10C_BRIDGE_ARGS_JSON=$args"
          } >> "$GITHUB_ENV"
      # Each process owns a fresh fixture and absence-confirmed cleanup.
      # The 150-second, 250-request, 160-API, 5/second and 16-paused
      # browser ceilings are unchanged; unlink waits the real cooldown.
      - name: Optional live notices and owner changes with a fresh synthetic fixture
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: frontend
        env:
          AQUA_P05_DIST: ${{ github.workspace }}/frontend/dist
          AQUA_P05_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/synthetic-notices
        run: node checks/p10c-notice-browser.mjs
      - name: Fresh Google proof and current-session revocation
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10C_SCENARIO: google-session
          AQUA_P10C_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/google-session
        run: node checks/p10c-identity-browser.mjs
      - name: Fail closed on an invalid fresh Google assertion
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10C_SCENARIO: google-failure
          AQUA_P10C_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/google-failure
        run: node checks/p10c-identity-browser.mjs
      - name: Link an independently verified Google method
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10C_SCENARIO: link
          AQUA_P10C_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/link
        run: node checks/p10c-identity-browser.mjs
      - name: Unlink a Google method after the genuine account cooldown
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10C_SCENARIO: unlink
          AQUA_P10C_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/unlink
        run: node checks/p10c-identity-browser.mjs
      - name: Add a first password with distinct primary-mail confirmation
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10C_SCENARIO: password-add
          AQUA_P10C_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/password-add
        run: node checks/p10c-identity-browser.mjs
      - name: Change primary email with old and new mailbox confirmation
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10C_SCENARIO: email
          AQUA_P10C_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/email
        run: node checks/p10c-identity-browser.mjs
      - name: Reconcile a lost email-change response without replay
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10C_SCENARIO: lost-email
          AQUA_P10C_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/lost-email
        run: node checks/p10c-identity-browser.mjs
      - name: Independent notification consent CAS and stale revision
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10C_SCENARIO: notifications
          AQUA_P10C_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/notifications
        run: node checks/p10c-identity-browser.mjs
      - name: Deny removal of the last usable sign-in method
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 4
        working-directory: frontend
        env:
          AQUA_P10C_SCENARIO: last-method
          AQUA_P10C_ARTIFACT_DIR: ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/last-method
        run: node checks/p10c-identity-browser.mjs
      - name: Retain bounded synthetic identity evidence after success or failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p10c-identity-${{ matrix.shell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/synthetic-notices/report.json
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/synthetic-notices/p10c-*.png
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/google-session/p10c-identity-browser-report.json
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/google-session/p10c-*.png
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/google-failure/p10c-identity-browser-report.json
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/google-failure/p10c-*.png
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/link/p10c-identity-browser-report.json
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/link/p10c-*.png
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/unlink/p10c-identity-browser-report.json
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/unlink/p10c-*.png
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/password-add/p10c-identity-browser-report.json
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/password-add/p10c-*.png
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/email/p10c-identity-browser-report.json
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/email/p10c-*.png
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/lost-email/p10c-identity-browser-report.json
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/lost-email/p10c-*.png
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/notifications/p10c-identity-browser-report.json
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/notifications/p10c-*.png
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/last-method/p10c-identity-browser-report.json
            ${{ runner.temp }}/aqua-p10c/${{ matrix.shell }}/last-method/p10c-*.png
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
