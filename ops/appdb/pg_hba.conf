# Effective HBA for the private app cluster. Never copy to the hosted dataset.
local all postgres peer
local aqua_app aqua_app_runtime scram-sha-256
local aqua_app aqua_app_migrator scram-sha-256
local aqua_app aqua_app_backup scram-sha-256
local all all reject
host all all 0.0.0.0/0 reject
host all all ::/0 reject
