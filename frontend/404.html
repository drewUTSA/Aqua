<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Return to AQUA when a page cannot be found.">
    <meta name="robots" content="noindex, nofollow">
    <title>Page not found | AQUA</title>
    <style>
      :root { color-scheme: light dark; font-family: Manrope, system-ui, sans-serif; }
      body { margin: 0; background: #f5f5f2; color: #202128; }
      main { max-width: 36rem; margin: 18vh auto 0; padding: 0 1.5rem 3rem; }
      h1 { font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; }
      p { line-height: 1.6; }
      a { display: inline-block; padding: .65rem 0; color: #514174; font-weight: 600; }
      a:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
      @media (prefers-color-scheme: dark) {
        body { background: #0b0c0e; color: #f2f1ed; }
        a { color: #cdc8ec; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>Check the address or return to AQUA.</p>
      <a href="/" referrerpolicy="no-referrer">Back to AQUA</a>
    </main>
  </body>
</html>
