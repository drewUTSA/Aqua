# Production web server for aqua-ai.us: serves the built site and forwards
# /api to the backend on this machine. Listens on 5173, the port the dev
# server used, so whatever routes the domain here needs no change.
# HTTPS is terminated in front of this (Cloudflare or another proxy).

# Never let request headers create a new quota. Until the exact ingress trust
# chain is deployed and verified, the tunnel's peer shares an aggregate budget.
# See docs/security/P01_BOUNDARIES.md before enabling per-visitor real-IP trust.

# Each question costs 20 to 80 seconds of model time; 10 a minute per
# visitor, with a burst of 5, is far above real use and stops floods.
limit_req_zone $binary_remote_addr zone=aqua_query:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=aqua_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=aqua_login_bootstrap:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=aqua_password_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=aqua_registration:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=aqua_recovery:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=aqua_password_proof:10m rate=5r/m;
limit_req_status 429;

server {
    listen 127.0.0.1:5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16k;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Readiness acquires an application DB lease. Keep it on the backend's
    # loopback port so public probes cannot consume the account-storage pool.
    location ~ ^/api/ready(?:/|$) {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 404 '{"detail":"Not found"}';
    }

    # Answers can take minutes when the model retries, so wait long.
    location ~ ^/api/query(?:/|$) {
        limit_req zone=aqua_query burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/api/auth/google(?:/|$) {
        limit_req zone=aqua_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 30s;
    }

    # A bootstrap issues a durable challenge. Reject floods before DB work.
    location ~ ^/api/auth/config(?:/|$) {
        limit_req zone=aqua_login_bootstrap burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 10s;
    }

    # Independent password boundaries preserve login/recovery during registration
    # abuse. All are socket-peer aggregates until ingress attribution is reviewed.
    location ~ ^/api/v1/auth/bootstrap(?:/|$) {
        limit_req zone=aqua_login_bootstrap burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 10s;
    }
    location ~ ^/api/v1/auth/password-login(?:/|$) {
        limit_req zone=aqua_password_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 10s;
    }
    location ~ ^/api/v1/auth/registrations(?:/|$) {
        limit_req zone=aqua_registration burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 10s;
    }
    location ~ ^/api/v1/auth/password-reset-requests(?:/|$) {
        limit_req zone=aqua_recovery burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 10s;
    }
    location ~ ^/api/v1/auth/(?:email-verifications|password-resets)(?:/|$) {
        limit_req zone=aqua_password_proof burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 10s;
    }

    # Conservative cooldown for five-per-minute budgets; never echo request contents.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 12 always;
        add_header Cache-Control no-store always;
        return 429 '{"detail":"Too many requests. Try again shortly."}';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 30s;
    }

    # Vite puts a content hash in every asset name, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: every other path is the app itself, never cached,
    # so a new deploy shows up on the next page load.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
