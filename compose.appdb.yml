# Opt-in private storage, independently deployed after migration review.
name: aqua-app-storage
services:
  app-db:
    image: postgres@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    container_name: aqua-app-db
    user: "999:999"
    group_add: ["1000"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 128
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256
    command: [postgres, -c, listen_addresses=, -c, unix_socket_permissions=0770, -c, unix_socket_group=1000, -c, hba_file=/etc/postgresql/aqua_hba.conf, -c, password_encryption=scram-sha-256, -c, max_connections=32, -c, shared_buffers=128MB, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    network_mode: none
    volumes:
      - aqua_app_data:/var/lib/postgresql/data
      - aqua_app_sockets:/var/run/postgresql
      - ./ops/appdb/pg_hba.conf:/etc/postgresql/aqua_hba.conf:ro
      - ${AQUA_PRIVATE_STORAGE_DIR:?Set the reviewed private AQUA storage directory}/bootstrap-password:/run/secrets/bootstrap_password:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=67108864
    healthcheck:
      test: [CMD-SHELL, "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -h /var/run/postgresql -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 5
    logging:
      driver: local
      options: {max-size: "2m", max-file: "2"}
volumes:
  aqua_app_data:
    name: aqua_app_data
  aqua_app_sockets:
    name: aqua_app_sockets
